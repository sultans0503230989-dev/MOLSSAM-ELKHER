<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صلوات الفتوحات على نبينا سيد السادات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3ee;--fg:#16301a;--muted:#5b6f5e;--card:#fff;--line:#d3ddd4;--acc:#1b6b2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d140e;--fg:#e8f0e8;--muted:#98ab9b;--card:#16201a;--line:#2a3a2d;--acc:#4cbf63}}
:root[data-theme="dark"]{--bg:#0d140e;--fg:#e8f0e8;--muted:#98ab9b;--card:#16201a;--line:#2a3a2d;--acc:#4cbf63}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100%}
h1{font-size:20px;margin:0;text-align:center}
.top{padding:16px 14px 4px}
.top p{margin:4px 0 0;text-align:center;color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 14px;padding:14px;max-width:420px;margin-inline:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
label{font-size:14px}
select,input[type=number]{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input[type=number]{width:84px}
.btn{font:inherit;font-weight:800;width:100%;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;cursor:pointer}
.btn.stop{background:#b3261e}
#status{margin-top:10px;text-align:center;color:var(--muted);font-size:14px;min-height:22px}
.chk{display:flex;gap:6px;align-items:center;font-size:14px}
.list{display:flex;flex-direction:column;align-items:center;gap:18px;padding:8px 14px 40px}
/* ===== البوست الموحد ===== */
.post{width:100%;max-width:380px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
background:linear-gradient(180deg,#1f6f2c 0%,#14501d 45%,#0d3a14 100%);color:#fff;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.25);border:2px solid #c9a54a}
.hdr{flex:0 0 17%;display:flex;align-items:center;justify-content:center;flex-direction:column;
background:radial-gradient(circle at 50% 120%,#e9d28a 0,#c9a54a 22%,transparent 23%),
repeating-conic-gradient(from 0deg at 50% 100%,#2c8a3b 0 7.5deg,#1a5f26 7.5deg 15deg);
border-bottom:3px solid #c9a54a}
.hdr small{font-size:13px;color:#fff6d6;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:600}
.ttl{margin:-14px 16px 0;padding:8px 10px;text-align:center;font-weight:800;font-size:clamp(18px,5.4vw,24px);
background:linear-gradient(180deg,#a8d36a,#6aa83a);color:#0c2a10;border:2px solid #e3c870;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.body{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:14px 18px;text-align:center;font-weight:700;
font-size:26px;line-height:2;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.body span{display:block;font-size:inherit}
.ftr{flex:0 0 20%;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;background:linear-gradient(0deg,#0a2d10,transparent);
border-top:2px solid #c9a54a;color:#d9f0b8;font-size:13px;font-weight:600;text-align:center;padding:0 8px}

<div class="top"><h1>صلوات الفتوحات على نبينا سيد السادات ﷺ</h1><p>اللهم صل وسلم على سيدنا محمد وعلى آله</p></div>

  <div class="row"><label for="mins">ذكّرني كل</label>
    <select id="preset"><option value="1">دقيقة</option><option value="5">5 دقائق</option><option value="10">10 دقائق</option><option value="15">15 دقيقة</option><option value="30">30 دقيقة</option><option value="60">ساعة</option><option value="120">ساعتين</option><option value="0">وقت مخصص…</option></select>

<script>
const D=[
["الصلاة الإبراهيمية","اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ وَبَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ فِي الْعَالَمِينَ إِنَّكَ حَمِيدٌ مَجِيدٌ."],
["صلاة الفاتح","اللهم صل على سيدنا محمد الفاتح لما اغلق، والخاتم لما سبق، ناصر الحق بالحق، والهادي الي صراطك المستقيم، وعلى آله حق قدره ومقداره العظيم."],
["الصلاة النارية","اللهم صل صلاة كاملة وسلم سلاما تاما على سيدنا محمد الذي تنحل به العقد، وتنفرج به الكرب، وتقضى به الحوائج، وتنال به الرغائب، وحسن الخواتم، ويستسقي الغمام بوجهه الكريم، وعلى آله وصحبه في كل نفس بعدد كل معلوم لك."],
["الصلاة المنجية","اللهم صل على محمد صلاة تنجينا بها من جميع الأهوال والآفات وتقضي لنا بها الحاجات وتطهرنا بها من جميع السيئات وترفعنا بها عندك أعلى الدرجات وتبلغنا بها أقصى الغايات من جميع الخيرات في الحياة وبعد الممات"],
["الصلاة الشاذلية","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ النَّبِيِّ الأُمِّيِّ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ تَسْلِيماً بِقَدْرِ عَظَمَةِ ذَاتِكَ فِي كُلِّ وَقْتٍ وَحِينٍ."],
["صلاة الفتح المبين","اللهم صل وسلم وبارك على المبعوث رحمة للعالمين سيد الأولين والآخرين قائد الغر المحجلين صلاة تملأ قلوبنا بالنور والفتح المبين وعلى آله وصحبه وسلم تسليما."],
["صلاة الإنقاذ النبوي","اللهم صلِّ وسلِّم على سيدِنا محمد صلاةً تحلُّ بها عُقدتي ، و تفرج بها كربتي ، وتنقذني بها من وحلتي ، وتقيل بها عثرتي ، وتقضي بها حاجتي"],
["عروس الممالك","اللهم صل وسلم وبارك على سيدنا محمد وآله: عروس الممالك رحمة ربي المالك ماصلت عليه الملائك وجرت في البحر الفلائك صلاة منجية من المهالك تقشع كل ظلام حالك وتنير طريق كل سالك تدخلنا في ولايتك وننعم بأفضالك"],
["صلاة الأنوار","اللهم صل على سيدنا محمد نور الأنوار ، و سر الأسرار ، و ترياق الأغيار ، و مفتاح باب اليسار ، سيدنا محمد المختار ، و آله الأطهار ، و أصحابه الأخيار ،عدد نعم الله و افضاله ."],
["صلاة سيدنا المتبولي","اللَّهُمَّ إِنِّي أَسْأَلُكَ بِكَ أَنْ تُصَلِّىَ عَلَى سَيِّدِنَا سيدنا مُحَمَّدٍ وَعَلَى سَائِرِ الأَنْبِيَاءِ وَالْمُرْسَلِينَ وَعَلَى آلِهِمْ وَصَحْبِهِمْ أَجْمَعِينَ وَأَنْ تَغْفِرَ لِي مَا مَضَى وَتَحْفَظَنِي فِيمَا بَقِيَ."],
["صلاة على النبي الرضي المرضي","اللهم صَلِّ على سيدنا محمد النبي الامي، الرضي المرضي، الطيب النقي، المبارك التقي، الطاهر الزكي، المطهرالوفي، وال سيدنا محمد الطيبين الاخيار،كما صليت على ابراهيم وال ابراهيم انك حميد مجيد."],
["صلاة على النبي","اللهم صَلِّ على محمد عدد السحاب الجارية وصَلِّ على محمد عدد الرياح الذارية من يوم خلقت الدنيا إلى يوم القيامة فى كل يوم ألف مرة وعلى آله وسلم."],
["عدد حروف القرآن","اللهم صَلِّ وسلم على سيدنا ومولانا محمد و آله وأصحابه عدد ما في جميع القرآن حرف حرف بعدد كل حرف ألف ألف."],
["صلاة على النبي","اللهم صَلِّ على سيدنا ومولانا محمد عدد قطر الأمطار ، وصَلِّ عليه عدد أوراق الأشجار ، وصَلِّ عليه عدد دواب القفار وصَلِّ عليه عدد مياه البحار وعلى آله وسلم."],
["علم الله المكنون","اللهم صَلِّ على سيدنا محمد عدد ما كان وعدد ما يكون وعدد ما في علم الله المكنون وعلى آله وسلم."],
["صلاة على النبي","اللهم صَلِّ على سيدنا محمد وعلى كل نبي وملك وولي عدد الشفع والوتر ، وعدد كلمات ربنا التامات المباركات وعلى آله وسلم."],
["صلاة على النبي","اللهم صَلِّ على سيدنا محمد عبدك ونبيك ورسولك النبي الأمي وعلى آله وأزواجه وذريته وسلم عدد خلقك ، ورضانفسك ، وزنة عرشك ، ومداد كلماتك."],
["الصلاة الكمالية","اللهم صل وسلم وبارك على سيدنا وعلى آله عدد كمال الله وكما يليق بكماله"],
["صلاة الإنعام","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكَ عَلَى سَيِّدِنَا سيدنا مُحَمَّدٍ وَعَلَى آلِهِ عَدَدَ إِنْعَامِ اللَّهِ وَأَفْضَالِهِ."],
["صلاة الرؤوف الرحيم","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا سيدنا مُحَمَّدٍ الرَّؤُوفِ الرَّحِيمِ ذِي الْخُلُقِ الْعَظِيمِ وَعَلَى آلِهِ وَأَصْحَابِهِ وَأَزْوَاجِهِ فِي كلِّ لَحْظَةٍ عَدَدَ كلِّ حَادِثٍ وَقَدِيمٍ"],
["صلاة تفريج الكروب","اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ قَدْ ضَاقَتْ حِيلَتِي أَدْرِكْنِي يَا رَسُولَ اللَّه"],
["الصلاة الأمية","اللهم صلي على سيدنا محمد عبدك ونبيك ورسولك النبي الأمي وعلى آله وصحبه وسلم تسليما."],
["صلاة التسخير","اللهم صل على سيدنا محمد وآله صلاة تسخر لي بها كل شيء يا من بيده ملكوت كل شيء."],
["صلاة فيضان الأرزاق","اللهم صل على سيدنا ومولانا محمد صلاة نستوجب بها رضاك ولا تحوجنا لاحد سواك."],
["صلاة السعادة","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَدَدَ مَا فِي عِلْمِ اللَّهِ صَلاَةً دَائِمَةً بِدَوَامِ مُلْكِ اللَّهِ."],
["صلاة سيدنا الخجندي","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ صَلاَةً أَنْتَ أَهْلٌ وَهُوَ لَهَا أَهْلٌ."],
["صلاة سيدنا خالد أبوعوف","اللهم صل على سيدنا محمد قدر عزتك لا إله إلاأنت وجلالها ، وقدس أسماءك وصفاتك وجمالها ،وعظمة ذاتك وكمالها. وعلى آله وسلم"],
["صلاة سيدنا بدر الدين الحسني","اللهم صل على سيدنا محمد النبي الأمي الحبيب المحبوب عالي القدر عظيم الجاه وعلى اله وصحبه وسلم"],
["صلاة على النبي","اللهم صَلِّ على سيدنا محمد محمد بن عبدالله القائم بأمر الله القائل ما ضاق أمرإلا فرجه الله وعلى آله وسلم."],
["صلاة على النبي","اللهم صَلِّ على سيدنا محمد الحبيب البشير الشفيع النذير ، الذي أخبر عن ربه بأن له في كل نفسٍ مائة ألف فرجٍ قريب ، وعلى آله وسلم تسليماً كثيراً."]
,["صلاة على سيدنا النبي","اللهم صل على سيدنا محمد واله نبي الرحمة واهل بيته الميامين الطاهرين، ولا تردنا يا الهي من رحمتك خائبين، ولا من فضلك ايسين، واعذنا ان نضل بعد اذ هديتنا، واجرنا من الحيرة في الدين، وتوفنا مسلمين والحقنا بالصالحين، بمحمد واله الطيبين امين يارب العالمين."],
["صلاة على سيدنا النبي","اللهم صَلِّ وسلم على سيدنا محمد وعلى آله صَلَّاة وسلام أهل السماوات والأرضين عليه ، وأجر يا مولانا لطفك الخفي في أمري ، وأرني سرَّ جميل صُنعك فيما آمله ، يا الله ياسميع يارب العالمين وعلى آله وسلم."],
["صلاة على سيدنا النبي","اللهم صَلِّ وسلم على سيدنا محمد وعلى آله صَلَّاة تكون لنا طريقاً لقربه ، وتأكيداً لحبه ، وباباً لجمعنا به ، وهدية مقبولة بين يديه ، وسلم وبارك كذلك أبداً ، وارض عن آله وصحبه السعدا ، واكسنا حُلل الرضا ، والطف بنا في القضا."],
["صلاة على سيدنا النبي","اللهم أجعل افضل الصَّلَوات وأسمى البركات وأزكى التحيات في جميع الأوقات على أشرف المخلوقات سيدنا ومولانا محمد أكمل أهل الأرض والسموات وسلم عليه يا ربنا أزكى التحيات في جميع الحضرات واللحظات وعلى آله وسلم."],
["صلاة على سيدنا النبي","اللهم صَلِّ على سيدنا محمد مااتصلت العيون بالنظر , وتزخرفت الأرضون بالمطر , وحج حاج واعتمر ,ولبَّى ونحر , وطاف بالبيت العتيق وقبَّل الحجر وعلى آله وسلم."],
["صلاة على سيدنا النبي","اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ مِلْءَ الدنْيَا وَمِلْءَ الآخِرَةِ وَارْحَمْ مُحَمَّداً وَآلَ مُحَمَّدٍ مِلْءَ الدنْيَا وَمِلْءَ الآخِرَةِ وَاجْزِ مُحَمَّداً وَآلَ مُحَمَّدٍ مِلْءَ الدنْيَا وَمِلْءَالآخِرَةِ وَسَلِّمْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ مِلْءَ الدنْيَا وَمِلْءَ الآخِرَةِ."],
["صلاة على سيدنا النبي","اللهم صَلِّ على سيدنا محمد وعلى آله صَلاة تتفاضل على كل صَلاة صَلاها المصَلُّون من أول الدهر إلى آخره كفضل الله على خلقه وملء الميزان ومنتهى العلم ومبلغ الرضا وزنة العرش وسعة الكرسي."],
["صلاة على سيدنا النبي","اللهم صَلِّ على سيدنا محمد وعلى آل سيدنا محمد في الأولين والآخرين وفي الملأ الأعلى إلى يوم الدين."],
["صلاة على سيدنا النبي","اللهم صَلِّ وسلم على سيدنا محمد وعلى آل سيدنا محمد صَلاة تكون لك رضا ولحقه آداء وأعطه الوسيلة والمقام الذي وعدته."],
["صلوات الجعفرية","اللهمِّ صلِّ على سيدنا محمد، صلاة تَكشِفُ بها الران عن قلوبنا، وتُيسِّرُ بها أُمورَنَا، وتستُر بها عيوبنا، وتَغفرُ بها ذنوبنا، وتَقضى بها ديوننا، وتُزكّى بها نفوسنا، وتُنوِّرُ بها أبصارَنا وقلوبنا، وعلى آله وسلِّم."],
["صلاة استشعار الحبيب الأعظم","اللهم صل على سيدنا محمد وعلى آله والأصحاب صلاة وسلامة ترفع بهما بيننا وبينه الحجاب وتدخلنا بهما عليه من أوسع باب وتسقينا بهما بيده الشريفة أعذب الكؤوس من اجل الشراب"],
["صلاة استشعار الحبيب الأعظم","اللهم صل على سيدنا محمد وعلى آله وصحبه وسلم صلاة يتجدد بها سروره ويتضاعف بها حبوره ويشرق بها على قلبي نوره"],
["صلاة استشعار الحبيب الأعظم","اللهم صل على سيدنا محمد نورك الساري ومددك الجاري واجمعني به في كل أطواري وعلى آله وصحبه وسلم يا نور."],
["صلوات الجعفرية","اللهم صل على من أعليت له الرتب, وكشفت له الحجب, فرقى إلى ما لم يرقى إليه الخليل, ووصل إلى ما لم يصل إليه جبريل, ونظر ما لم ينظره الكليم, ووصفته بأنه بالمؤمنين رؤوف رحيم, وصليت عليه أنت وملائكتك تحببا وتكريما,"],
["صلاة لقضاء الحوائج","اللهم صل وسلم على سيدنا محمد صلاة تنحل بها عقدتي, وتنفرج بها كربتي, وتنكشف بها غمتي, وتنقذني بها من وحلتي, وتقيلني بها من عثرتي, وتقضي بها حاجتي, وبأني أشهد أن لا إله إلا أنت الأحد الصمد الذي لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُنْ لَهُ كفُوًا أَحَدٌ."],
["صلاة الرزق والفرج","اللهم صل وسلم وبارك على محمد وآل بيت محمد صلاةً تأتينا بها من الله برزقٍ وفرجٍ وحفظاً من كل بلاء من السماء نزل ومن الارض خرج وتحمينا من البلاء والقحط والحرج وتخرجنا من الضيق الذي عن طوره خرج بجاه من صلت خلفه الانبياء ثم في السماء عرج صلاةً ما صلاها مهموماً الا وانفرج برحمةٍ منك يا ارحم الراحمين."],
["صلاة أولي العزم","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَآدَمَ وَنُوحٍ وَإِبْرَاهِيمَ وَمُوسَى وَعِيسَى وَمَا بَيْنَهُمْ مِنَ النَّبِيِّينَ وَالْمُرْسَلِينَ صَلَوَاتُ اللهِ وَسَلاَمُهُ عَلَيْهِمْ أَجْمَعِينَ."],
["الصلاة الصغرى","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ السَّابِقِ لِلْخَلْقِ نُورُه، وَالرَّحْمَةِ لِلْعَالَمِينَ ظُهُورُهُ، عَدَدَ مَنْ مَضَىٰ مِنْ خَلْقِكَ وَمَنْ بَقِيَ، وَمَنْ سَعِدَ مِنْهُمْ وَمَنْ شَقِيَ، صَلَاةً تَسْتَغْرِقُ الْعَدَّ وَتُحِيطُ بِالْحَدِّ، صَلَاةً لَا غَايَةَ لَهَا وَلَا انْتِهَاءَ، وَلَا أَمَدَ وَلَا انْقِضَاءَ، صَلَاتِكَ الَّتِي صَلَّيتَ عَلَيْهِ، صَلَاةً دَائِمَةً بِدَوَامِكَ، بَاقِيَةً بِبَقَائِكَ، لَا مُنْتَهَىٰ لَهَا دُونَ عِلْمِكَ، وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ تَسْلِيمَاً، مِثْلَ ذَلِكَ، وَالْحَمْدُ لِلَّهِ عَلَى ذَلِكَ."],
["صلاة سيدي ابراهيم الكباشي","اللهم صل على سيدنا محمد مفتاح رحمتك وعين نعمتك النور الساري في سائر الاسماء والصفات عدد ما علمت وملء ما علمت وزنة ما علمت وعلى آله كما لا نهاية لكمالك وعد كماله صلاة تهب لنا بها ما وهبته لأنبيائك واوليائك واصفيائك وان تشهدنا وحدانية الذات والافعال والصفات وتبلغنا كفاية الدارين من أمور الدنيا والدين آمين."],
["صلاة سيدنا ابن عطاء","اللَّهُمَّ صَلِّ وَسَلِّم عَلَى سَيِّدِنَا مُحَمَّدٍ وَآلِهِ فِي كلِّ لَمْحَةٍ وَنَفَسٍ قَدْرَ لاإِلَهَ إِلاالله * وَأَغْنِنَا وَاحْفَظْنَا وَوَفِّقْنَا لِمَا تَرْضَاه * وَاصْرِف عَنَّا السوءَ وَارْضَ عَنِ الْحِسَنَيْنِ رَيْحَانَتَيْ خَيْرِ الأَنَامِ وَعَنْ سَائِرِ آلِهِ وَأَصْحَابِهِ الْكِرَام * وَأَدْخِلْنَا الْجَنَّةَ دَارَ السَّلامِ بِسَلام * يَاحَي يَاقَيُّومُ يَاالله"],
["صلاة سيدنا أبي سعيد الخدري","اللَّهُمَّ صَلِّ عَلَى سيدنا مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ وَصَلِّ عَلَى الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَالْمُسْلِمِينَ وَالْمُسْلِمَاتِ."],
["صلاة سيدنا البصري","اللَّهُمَّ صَلِّ عَلَى سيدنا مُحَمَّدٍ وَعَلَى آلِهِ وَأَصْحَابِهِ وَأَوْلاَدِهِ وَأَزْوَاجِهِ وَذُرِّيَّتِهِ وَأَهْلِ بَيْتِهِ وَأَصْهَارِهِ وَأَنْصَارِهِ وَأَشْيَاعِهِ وَمُحِبِّيهِ وَأُمَّتِهِ وَعَلَيْنَا مَعَهُمْ أَجْمَعِينَ يَا أَرْحَمَ الرَّاحِمِينَ."],
["صلاة الغزالي","اللَّهُمَّ اجْعَلْ صَلَوَاتِكَ وَرَحْمَتَكَ وَبَرَكَاتِكَ عَلَى سَيِّدِ الْمُرْسَلِينَ وَإِمَامِ الْمُتَّقِينَ وَخَاتِمِ النَّبِيِّينَ عَبْدِكَ وَرَسُولِكَ إِمَامِ الْخَيْرِ وَقَائِدِ الْخَيْرِ وَرَسُولِ الرَّحْمَةِ اللَّهُمَّ ابْعَثْهُ الْمَقَامَ الْمَحْمُودَ الَّذِي يَغْبِطُهُ بِهِ الأَوَّلُونَ وَالآخِرُونَ."],
["صلاة الفاسي","اللَّهُمَّ صَلِّ عَلَى سيدنا مُحَمَّدٍ وَعَلَى آلِ سيدنا مُحَمَّدٍ حَتَّى لاَ يَبْقَى مِنَ الصَّلاَةِ شَيْءٌ وَارْحَمْ سيدنا مُحَمَّد وَآلَ سيدنا مُحَمَّدٍ حَتَّى لاَ يَبْقَى مِنَ الرَّحْمَةِ شَيْءٌ وَبَارِكْ عَلَى سيدنا مُحَمَّدٍ وَعَلَى آلِ سيدنا مُحَمَّدٍ حَتَّى لاَ يَبْقَى مِنَ الْبَرَكَةِ شَيْءٌ وَسَلِّمْ عَلَى سيدنا مُحَمَّدٍ وَعَلَى آلِ سيدنا مُحَمَّدٍ حَتَّى لاَ يَبْقَى مِنَ السَّلاَمِ شَيْءٌ."],
["صلاة شمس الدين الحنفي","اللَّهُمَّ صَلِّ عَلَى سيدنا مُحَمَّدٍ النَّبيِّ الأُمِّيِّ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ عَدَدَ مَا عَلِمْتَ وَزِنَةَ مَا عَلِمْتَ وَمِلْءَ مَا عَلِمْتَ."],
["صلاة على سيدنا النبي","اللهم صَلِّ على سيدنا محمد وعلى ال سيدنا محمد عدد ما أحاط به علمك وجرى به قلمك وسبقت به مشيئتك وصَلَّت عليه ملائكتك صَلاة دائمة بدوامك باقية بفضلك وإحسانك إلى أبد الأبد."],
["صلاة على سيدنا النبي","اللهم صل على البشير النذير و السراج المنير أبى القاسم محمد وأله الطيبين الطاهرين"]
,["الصلاة الشافعية","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ النَّبِيِّ الأُمِّيِّ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ تَسْلِيماً بِقَدْرِ عَظَمَةِ ذَاتِكَ فِي كُلِّ وَقْتٍ وَحِينٍ."],
["صلاة نور القيامة","اللهم صل على سيدنا محمد بحر أنوارك ، و معدن أسرارك ، و لسان حجتك ، و عروس مملكتك ، و إمام حضرتك ، و طراز ملكك ، و خزائن رحمتك ، و طريق شريعتك ، المتلذذ بتوحيدك ، إنسان عين الوجود ، و السبب في كل موجود ، عين أعيان خلقك ، المتقدم من نور ضيائك ، صلاة تدوم بدوامك ، و تبقى ببقائك ، لا منتهى لها دون علمك ،صلاة ترضيك و ترضيه و ترضى بها عنا يارب العالمين ."],
["الصلاة النورانية","اللهم صل و سلم و بارك على سيدنا و مولانا محمد شجرة الأصل النورانية و لمعة القبضة الرحمانية ، و أفضل الخليقة الإنسانية ، و أشرف الصورة الجسمانية ، و معدن الأسرار الربانية ، و خزائن العلوم الاصطفائية ، صاحب القبضة الأصلية ، و البهجة السنية ، و الرتبة العلية ، من اندرجت النبيون تحت لوائه ، فهم منه و إليه ، و صل و سلم و بارك عليه و على آله و صحبه عدد ما خلقت و رزقت و أمت و أحييت إلي يوم تبعث من أفنيت ، و سلم تسليما كثيرا و الحمد لله رب العالمين ."],
["الصلاة الأسبقية","اللهم صل وسلم وبارك على نورك الأسبق وصراطك المحقق الذى أبرزته رحمة شاملة لوجودك وأكرمته بشهودك وأصطفيته لنبوتك ورسالتك وأرسلته بشيرا ونذيرا وداعيا إليك بإذنك وسراجا منيرا نقطة مركز باء الدائرة الأولية وسر أسرار الألف القطبانيه الذى فتقت به رتق الوجود وخصصته بأشرف المقامات لمواهب الأمتنان والمقام المحمود وأقسمت بحياته فى كلامك المشهود لأهل الكشف والشهود فهو سرك القديم السارى وماء جوهر الجوهرية الجارى. الذى أحييت به الموجودات من معدن وحيوان ونبات فهو قلب القلوب وروح الأرواح وعلم الكلمات الطيبات القلم الأعلى والعرش المحيط روح جسد الكونين وبرزخ البحرين وثانى أثنين وفخر الكونين أبو القاسم سيدنا محمدبن عبد الله بن عبدالمطلب عبدك ونبيك ورسولك النبى الأمى وعلى آله وصحبه وسلم تسليما كثيرا بقدر عظمة ذاتك فى كل وقت وحين سبحان ربك رب العزة عما يصفون وسلام على المرسلين والحمد لله رب العالمين"],
["صلاة سيدنا الرفاعي","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى نُورِكَ الأَسْبَقِ. وَصِرَاطِكَ الْمُحَقَّقِ. الَّذِي أَبْرَزْتَهُ رَحْمَةً شَامِلَةً لِوُجُودِكَ. وَأَكْرَمْتَهُ بِشُهُودِكَ. وَاصْطَفَيْتَهُ لِنُبُوَّتِكَ وَرِسَالَتِكَ وَأَرْسَلْتَهُ بَشِيراً وَنَذِيراً. وَدَاعِياً إِلَى الله بِإِذْنِهِ وَسِرَاجاً مُنِيراً. نُقْطَةُ مَرْكَزِ الْبَاءِ الدَّائِرَةِ الأَوَّلِيَّةِ. وَسِرُّ أَسْرَارِ الأَلِفِ الْقُطْبَانِيَّةِ. الَّذِي فَتَقْتَ بِهِ رَتْقَ الْوُجُودِ. وَخَصَصْتَهُ بِأَشْرَفِ الْمَقَامَاتِ بِمَوَاهِبِ الإِمْتِنَانِ وَالْمَقَامِ الْمَحْمُودِ. وَأَقْسَمْتَ بِحَيَاتِهِ فِي كِتَابِكَ الْمَشْهُودِ. لِأَهْلِ الْكَشْفِ وَالشُّهُودِ. فَهُوَ سِرُّكَ الْقَدِيمُ السَّارِي. وَمَاءُ جَوْهَرِيَّةِ الْجَوْهَرِ الْجَارِي. الَّذِي أَحْيَيْتَ بِهِ الْمَوْجُودَاتِ. مِنْ مَعْدِنٍ وَحَيَوَانٍ وَنَبَاتٍ. قَلْبِ الْقُلُوبِ وَرُوحِ الأَرْوَاحِ وَإِعْلَامِ الْكَلِمَاتِ الطَّيِّبَاتِ. الْقَلَمِ الأَعْلَى وَالْعَرْشِ الْمُحِيطِ رُوحِ جَسَدِ الْكَوْنَيْنِ. وَبَرْزَخِ الْبَحْرَيْنِ. وَثَانِي اثْنَيْنِ. وَفَخْرِ الْكَوْنَيْنِ. أَبِي الْقَاسِمِ أَبِي الطَّيِّبِ سَيِّدِنَا مُحَمَّدِ بْنِ عَبْدِ الله بْنِ عَبْدِ الْمُطَّلِبِ عَبْدِكَ وَنَبِيِّكَ وَحَبِيبِكَ وَرَسُولِكَ النَّبِيِّ الأُمِّيِّ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ تَسْلِيماً كَثِيراً بِقَدْرِ عَظَمَةِ ذَاتِكَ فِي كُلِّ وَقْتٍ وَحِينٍ سُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ وَسَلَامٌ عَلَى الْمُرْسَلِينَ وَالْحَمْدُ لله رَبِّ الْعَالَمِينَ."],
["صلاة على سيدنا النبي","اللَّهُمَّ إِنِّي أَسْأَلُكَ بِنُورِ وَجْهِ اللهِ الْعَظِيمِ الَّذِي مَلأَ أَرْكَانَ عَرْشِ اللهِ الْعَظِيمِ وَقَامَتْ بِهِ عَوَالِمُ اللهِ الْعَظِيمِ أَنْ تُصَلِّيَ عَلَى مَوْلاَنَا مُحَمَّدٍ ذِي الْقَدْرِ الْعَظِيمِ وَعَلَى آلِ نَبِيِّ اللهِ الْعَظِيمِ بِقَدْرِ ذَاتِ اللهِ الْعَظِيمِ فِي كلِّ لَمْحَةٍ وَنَفَسٍ عَدَدَ مَا فِي عِلْمِ اللهِ الْعَظِيمِ صَلاَةً دَائِمَةً بِدَوَامِ اللهِ الْعَظِيمِ تَعْظِيماً لِحَقِّكَ يَا مَوْلاَنَا يَا مُحَمَّدُ يَا ذَا الْخُلُقِ الْعَظِيمِ وَسَلِّمْ عَلَيْهِ وَعَلَى آلِهِ مِثْلَ ذَلِكَ وَاجْمَعْ بَيْنِي وَبَيْنَهُ كَمَا جَمَعْتَ بَيْنَ الروحِ وَالنَّفْسِ ظَاهِراً وَبَاطِناً يَقَظَةً وَمَنَاماً وَاجْعَلْهُ يَا رَبِّ رُوحاً لِذَاتِي مِنْ جَمِيعِ الْوُجُوهِ فِي الدُّنْيَا قَبْلَ الآخِرَةِ يَا عَظِيمُ."],
["لمن شكا الفقر","اللهم صل على محمد وعلى آل محمد ، وهب لنا اللهم من رزقك الحلال الطيب المبارك ، ما نصون به وجوهنا عن التعرض إلى أحد من خلقك ، واجعل لنا اللهم إليه طريقة سهلا ، غير تعب ، ولا نصب ، ولا منة ، ولا تبعة، وجنبنا اللهم الحرام حيث كان ، وأين كان ، وعند من كان ، وحل بيننا وبين أهله ، واقبض عنا أيديهم ، واصرف عنا قلوبهم، حتى لا تنقلب إلا فيما يرضيك ، ولا نستعين بنعمتك إلا على ما تحب ، يا أرحم الراحمين"],
["صلاة ب 1000 صلاة","اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ وَأَعْطِهِ الْوَسِيلَةَ وَالْفَضِيلَةَ وَالدَّرَجَةَ الرَّفِيعَةَ وَابْعَثْهُ الْمَقَامَ الْمَحْمُودَ الَّذِي وَعَدْتَهُ مَعَ إِخْوَانِهِ مِنَ النَّبِيِّينَ وَالصَّالِحِينَ وَصَلِّ اللهُ عَلَى نَبِيِّ الرَّحْمَةِ وَسَيِّدِ الأُمَّةِ وَعَلَى أَبِينَا آدَمَ وَأُمِّنَا حَوَّاءَ وَمَنْ وَلَدَا مِنَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ وَالصَّالِحِينَ وَصَلِّ عَلَى مَلائِكَتِكَ أَجْمَعِينَ مِنْ أَهْلِ السَّمَوَاتِ وَالأَرْضِينَ وَعَلَيْنَا مَعَهُمْ يَا أَرْحَمَ الرَّاحِمِينَ السَّيِّدِ الْكَامِلِ الْفَاتِحِ الْخَاتِمِ عَدَدَ مَا فِي عِلْمِكَ كَائِنٌ أَوْ قَدْ كَانَ كُلَّمَا ذَكَرَكَ وَذَكَرَهُ الذَّاكِرُونَ وَغَفَلَ عَنْ ذِكْرِكَ وَذِكْرِهِ الْغَافِلُونَ صَلاةً دَائِمَةً بِدَوَامِكَ بَاقِيَةً بِبَقَائِكَ لا مُنْتَهَى لَهَا دُونَ عِلْمِكَ إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ"],
["الصلوات الإدريسية","اللهم صل على الكنه الذاتي و القدس الصفاتي نور الأسماء و رداء الكبرياء إزار العظمة الإلهية عين الإحاطة الذاتية تجليات الغيب و الشهادة إنسان عين الحقيقة الحقية و الخلقية محمد محمود أهل الأرض و السماء و روح حياة الماء الروح الإلهي و النور البهاء رحمة الوجود و علم الشهود صلاة ذاتية أزلية أبدية اللهم و سلم عليه مثل ذلك"],
["صلاة الشيخ صالح الحسيب","اللهم صل وسلم على سيدنا محمد وعلى آل سيدنا محمد كما صليت وترحمت على إبراهيم وعلى آل إبراهيم، وبارك على سيدنا محمد وعلى آل سيدنا محمد كما باركت على إبراهيم وعلى آل أبراهيم، في العالمين إنك حميدٌ مجيد، عدد خلقك، ورضا نفسك، وزنة عرشك، ومداد كلماتك، كلما ذكرك الذاكرون، وغفل عن ذكرك الغافلون، عدد ما فوق السماء، وعدد ما فوق الأرض، ويوم العرض على الله دائمة بدوام ملك الله والحمد لله رب العالمين"],
["صلاة الشفاء","اللهم صل وسلم وبارك على سيدنا محمد صلاة تشفينا بها من كل داء، وتعطينا بها أحسن الجزاء، وتحفظنا بما حفظتَه من الظالمين، والأعداء، وأنقذنا بحبه من جميع البلاء، والغلاء، وطهر بها نفوسنا من الكبر والأهواء، واجمع شتات كل أمتنا من المخربين الأعداء، وأنقذنا بحبه من جميع المحن والأخطاء، وافتح علينا كما فتحت لنبينا في غار حراء، وعلى آله وصحبه أصحاب الوفاء، والنقاء."],
["صلاة الوقاية","اللهم يا منزل الآيات والفرقان العظيم، صل وسلم وبارك على سيدنا ومولانا محمد النبي الأمين، الذي بعثته رحمة للعالمين، وعلى ألهِ الطاهرين، وأصحابه الميامين، وأتباعه الطيبين، وبصلاتنا عليه وبحرمة القرآن الكريم، اشرح لنا صدورنا، لمعرفة الهدى واليقين، ويسر لنا أمورنا، واقضِ لنا مآربنا، واعصم به قلوبنا، من الشيطان الرجيم، وأجر به أجسادنا من النيران، واحتط به وزرنا، وأخلص به نيتنا، واشدد به ازرنا، واصلح به شأننا، و اشفي به نفوسنا، ومرضانا، وأصلح به شأن، المسلمين اجمعين برحمتك يا ارحم الراحمين و يا رب العالمين"],
["صلاة محمد البديري","اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ الْفَاتِحِ الْخَاتِمِ الرَّسُولِ الْكَامِلِ الرَّحْمَةِ الشَامِلِ وَعَلَى آلِهِ وَأَصْحَابِهِ وَأَحْبَابِهِ عَدَدَ مَعْلُومَاتِ الله بِدَوَامِ الله صَلاَةً تَكُونُ لَكَ يَا رَبَّنَا رِضَاءً وَلِحَقِّهِ أَدَاءً وَأَسْأَلُكَ بِهِ مِنَ الرَّفِيقِ أَحْسَنَهُ وَمِنَ الطَّرِيقِ أَسْهَلَهُ وَمِنَ الْعِلْمِ أَنْفَعَهُ وَمِنَ الْعَمَلِ أَصْلَحَهُ وَمِنَ الْمَكَانِ أَفْسَحَهُ وَمِنَ الْعَيْشِ أَرْغَدَهُ وَمِنَ الرِّزْقِ أَطْيَبَهُ وَأَوْسَعَهُ."],
["الصلاة الذاتية","اللَّهُمَّ صَلِّ عَلَى الذَّاتِ الْمُحَمَّدِيَّةِ. اللَّطِيفَةِ الأَحَدِيَّةِ. شَمْسِ سَمَاءِ الأَسْرَارِ. وَمَظْهَرِ الأَنْوَارِ. وَمَرْكَزِ مَدَارِ الْجَلاَلِ. وَقُطْبِ فَلَكِ الْجَمَالِ. اللَّهُمَّ بِسِرِّهِ لَدَيْكَ. وَبِسَيرِهِ إِلَيْكَ. آمِنْ خَوْفِي وَأَقِلْ عَثْرَتِي وَأَذْهِبْ حُزْنِي وَحِرْصِي وَكُنْ لِي وَخُذْنِي إِلَيْكَ مِنِّي. وَارْزُقْنِي الْفَنَاءَ عَنِّي. وَلاَ تَجْعَلْنِي مَفْتُوناً بِنَفْسِي. مَحْجُوباً بِحِسِّي. وَاكْشِفْ لِي عَنْ كلِّ سِرٍّ مَكْتُومٍ. يَا حَي يَا قَيومُ."],
["صلاة سيدنا عبدالحليم محمود","اللَّهُمَّ صَلِّ صَلاَةَ جَلالٍ وَسَلِّمْ سَلاَمَ جَمَالٍ عَلَى حَضْرَةِ حَبِيبِكَ سَيِّدِنَا مُحَمَّدٍ وَاغْشِهِ اللَّهُمَّ بِنُورِكَ كَمَا غَشِيَتْهُ سَحَابَةُ التَّجَلِّيَاتِ فَنَظَرَ إِلَى وَجْهِكَ الكَرِيمِ، وَبِحَقِيقَةِ الحَقَائِقِ كلِّمَ مَوْلاهُ الْعَظِيمْ الذِّي أَعَاذَهُ مِنْ كلِّ سُوءٍ (( أَمَّنْ يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السوءَ )) وَعَلَى أَلِهِ وَصَحْبِهِ آمِين"],
["صلاة سيدنا النووي","السَّلاَمُ عَلَيْكَ يَا رَسُولَ اللهِ. السَّلاَمُ عَلَيْكَ يَا نَبِيَّ اللهِ. السَّلاَمُ عَلَيْكَ يَا خِيَرَةَ اللهِ. السَّلاَمُ عَلَيْكَ يَا خَيْرَ خَلْقِ اللهِ. السَّلاَمُ عَلَيْكَ يَا حَبِيبَ اللهِ. السَّلاَمُ عَلَيْكَ يَا نَذِيرُ. السَّلاَمُ عَلَيْكَ يَا بَشِيرُ. السَّلاَمُ عَلَيْكَ يَا ظَهِرُ. السَّلاَمُ عَلَيْكَ يَا طَاهِرُ. السَّلاَمُ عَلَيْكَ يَا نَبِيَّ الرَّحْمَةِ. السَّلاَمُ عَلَيْكَ يَا أَبَا الْقَاسِمِ. السَّلاَمُ عَلَيْكَ يَا رَسُولَ رَبِّ الْعَالَمِينَ. السَّلاَمُ عَلَيْكَ يَا سَيِّدَ الْمُرْسَلِينَ وَخَاتَمَ النَّبِيِّينَ. السَّلاَمُ عَلَيْكَ يَا خَيْرَ الْخَلاَئِقِ أَجْمَعِينَ. السَّلاَمُ عَلَيْكَ يَا قَائِدَ الْغُرِّ الْمُحَجَّلِينَ. السَّلاَمُ عَلَيْكَ وَعَلَى آلِكَ وَأَهْلِ بَيْتِكَ وَأَزْوَاجِكَ وَذُرِّيَّتِكَ وَأَصْحَابِكَ أَجْمَعِينَ. السَّلاَمُ عَلَيْكَ وَعَلَى سَائِرِ الأَنْبِيَاءِ وَجَمِيعِ عِبَادِ اللهِ الصَّالِحِينَ. جَزَاكَ اللهُ يَا رَسُولَ اللهِ عَنَّا أَفْضَلَ مَا جَزَى نَبِيًّا وَرَسُولاً عَنْ أُمَّتِهِ وَصَلَّى اللهُ عَلَيْكَ كُلَّمَا ذَكَرَكَ ذَاكِرٌ وَغَفَلَ عَنْ ذِكْرِكَ غَافِلٌ أَفْضَلَ وَأَكْمَلَ وَأَطْيَبَ مَا صَلَّى عَلَى أَحَدٍ مِنَ الْخَلْقِ أَجْمَعِينَ. أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللهُ وَحْدَهُ لاَ شَرِيكَ لَهُ وَأَشْهَدُ أَنَّكَ عَبْدُهُ وَرَسُولُهُ وَخِيرَتُهُ مِنْ خَلْقِهِ وَأَشْهَدُ أَنَّكَ قَدْ بَلَّغْتَ الرِّسَالَةَ وَأَدَّيْتَ الأَمَانَةَ وَنَصَحْتَ الأُمَّةَ وَجَاهَدْتَ فِي اللهِ حَقَّ جِهَادِهِ. اللَّهُمَّ وَآتِهِ الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَاماً مَحْمُوداً الَّذِي وَعَدْتَهُ وَآتِهِ نِهَايَةَ مَا يَنْبَغِي أَنْ يَسْأَلَهُ السَّائِلُونَ. اللَّهُمَّ صَلِّ عَلَى سيدنا مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ النَّبِيِّ الأُمِّيِّ وَعَلَى أَلِ سيدنا مُحَمَّدٍ وَأَزْوَاجِهِ وَذُرِّيَّتِهِ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى أَلِ إِبْرَاهِيمَ وَبَارِكْ عَلَى سيدنا مُحَمَّدٍ النَّبِيِّ الأُمِّيِّ وَعَلَى أَلِ سيدنا مُحَمَّدٍ وَأَزْوَاجِهِ وَذُرِّيَّتِهِ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى أَلِ إِبْرَاهِيمَ فِي الْعَالَمِينَ إِنَّكَ حَمِيدٌ مَجِيدٌ."],
["صلاة سيدنا علي","اللَّهُمَّ دَاحِيَ الْمَدْحُوَّاتِ وَبَارِئَ الْمَسْمُوكَاتِ اجْعَلْ شَرَائِفَ صَلَوَاتِكَ وَنَوَامِيَ بَرَكَاتِكَ وَرَأْفَةَ تَحَنُّنِكَ عَلَى سَيِّدِنَا مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ الْفَاتِحِ لِمَا أُغْلِقَ وَالْخَاتِمِ لِمَا سَبَقَ وَالْمُعْلِنِ الْحَقَّ بِالْحَقِّ وَالدَّامِغِ لِجَيْشَاتِ الأَبَاطِيلِ كَمَا حُمِّلَ فَاضْطَلَعَ بِأَمْرِكَ بِطَاعَتِكَ مُسْتَوْفِزاً فِي مَرْضَاتِكَ وَاعِياً لِوَحْيِكَ حَافِظاً لِعَهْدِكَ مَاضِياً عَلَى نَفَاذِ أَمْرِكَ حَتَّى أَوْرَى قَبَساً لِقَابِسٍ آلاَءَ اللهِ تَصِلُ بِأَهْلِهِ أَسْبَابَهُ بِهِ هُدِيَتِ الْقُلُوبُ بَعْدَ خَوْضَاتِ الْفِتَنِ وَالإِثْمِ وَأَبْهَجَ مُوضِحَاتِ الأَعْلاَمِ وَنَائِرَاتِ الأَحْكَامِ وَمُنِيرَاتِ الإِسْلاَمِ فَهُوَ أَمِينُكَ الْمَأْمُونُ وَخَازِنُ عِلْمِكَ الْمَخْزُونِ وَشَهِيدُكَ يَوْمَ الدِّينِ وَبَعِيثُكَ نِعْمَةً وَرَسُولُكَ بِالْحَقِّ رَحْمَةً اللَّهُمَّ أَعْلِ عَلَى بِنَاءِ النَّاسِ بِنَاءَهُ وَأَكْرِمْ مَثْوَاهُ لَدَيْكَ وَنُزُلَهُ وَأَتْمِمْ لَهُ نُورَهُ وَاجْزِهِ مِنِ ابْتِعَاثِكَ لَهُ مَقْبُولَ الشَّهَادَةِ وَمَرْضِيَّ الْمَقَالَةِ ذَا مَنْطِقٍ عَدْلٍ وَخُطَّةٍ فَصْلٍ وَبُرْهَانٍ عَظِيمٍ."],
["صلاة التدبير","اللهم إن في تدبيرك ما يغنينى عن الحيل، وإن في كرمك ما هو فوق الأمل، وإن في حلمك ما يسد الخلل، وإن في عفوك ما يمحو الزلل، اللهم فبقوة تدبيرك وفيض كرمك وسعة حلمك وعظيم عفوك صل وسلم وبارك على سيدنا محمد وعلى آله وصحبه صلاة تنجينا بها من كل شئ يا من بيده ملكوت كل شئ، اللهم لا نفتقر وأنت ربنا ولا نضام وأنت حسبنا وأنت على كل شئ قدير في كل لمحه ونفس عدد ما وسعه علم الله ."]
];
const $=id=>document.getElementById(id);
function post(t,x){return `<div class="post"><div class="hdr"><small>بسم الله الرحمن الرحيم</small></div><div class="ttl">${t}</div><div class="body"><span>${x}</span></div><div class="ftr"><div class="logo"></div><span>صلوات الفتوحات على نبينا سيد السادات</span></div></div>`}
function fit(r){r.querySelectorAll(".body").forEach(b=>{const t=b.firstChild,cs=getComputedStyle(b);let z=Math.min(23,Math.max(14,b.clientWidth/16));b.style.fontSize=z+"px";b.style.lineHeight="";
 const lim=b.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
 while(t.offsetHeight>lim&&z>5){z-=.5;b.style.fontSize=z+"px";b.style.lineHeight=z<13?"1.5":z<17?"1.7":""}})}
$("list").innerHTML=D.map(d=>post(d[0],d[1])).join("");fit(document);if(document.fonts)document.fonts.ready.then(()=>fit(document));addEventListener("resize",()=>fit(document));

let timer=null,tick=null,next=0,idx=0,ac=null,wl=null;
function save(){try{localStorage.setItem("sal",JSON.stringify({p:$("preset").value,m:$("mins").value,o:$("order").value,s:$("snd").checked,v:$("vib").checked,w:$("wake").checked,n:$("ntf").checked,k:$("spk").checked}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem("sal")||"null");if(!s)return;$("preset").value=s.p;$("mins").value=s.m||"";$("order").value=s.o;$("snd").checked=s.s;$("vib").checked=s.v;$("wake").checked=s.w;$("ntf").checked=!!s.n&&"Notification" in window&&Notification.permission==="granted";$("spk").checked=s.k!==false}catch(e){}$("mins").style.display=$("preset").value==="0"?"":"none"}
load();
$("preset").onchange=()=>{$("mins").style.display=$("preset").value==="0"?"":"none";save()};
["mins","order","snd","vib","wake","spk"].forEach(i=>$(i).onchange=save);
function getMin(){const v=$("preset").value==="0"?parseFloat($("mins").value):parseFloat($("preset").value);return v>0?v:null}
function chime(){if(!$("snd").checked||!ac)return;[660,880].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime+i*.35);g.gain.linearRampToValueAtTime(.25,ac.currentTime+i*.35+.05);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.35+1.2);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.35);o.stop(ac.currentTime+i*.35+1.3)})}

function tts(){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(PH);u.lang="ar-SA";u.rate=.85;
 const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("ar"));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function speak(){if(!$("spk").checked)return;setTimeout(()=>{try{if(window.Android&&Android.speak){Android.speak();return}
 AUD.currentTime=0;const r=AUD.play();if(r&&r.catch)r.catch(tts)}catch(e){tts()}},$("snd").checked?1500:0)}
function show(){const k=$("order").value==="rnd"?Math.floor(Math.random()*D.length):(idx++%D.length);$("ovpost").innerHTML=post(D[k][0],D[k][1]);$("ov").classList.add("on");notify(k);fit($("ovpost"));chime();speak();if($("vib").checked&&navigator.vibrate)navigator.vibrate([200,100,200])}
function notify(k){if(!$("ntf").checked||!document.hidden||!("Notification" in window)||Notification.permission!=="granted")return;
 const t="صلوات الفتوحات ﷺ",o={body:D[k][0]+"\n"+D[k][1].slice(0,120)+"…",tag:"salawat",renotify:true,dir:"rtl",lang:"ar",vibrate:[200,100,200]};
 try{const n=new Notification(t,o);n.onclick=()=>{window.focus();n.close()}}
 catch(e){try{navigator.serviceWorker.getRegistration().then(r=>r&&r.showNotification(t,o))}catch(e2){}}}
$("ntf").onchange=async()=>{if($("ntf").checked){
 if(!("Notification" in window)){$("ntf").checked=false;$("status").textContent="المتصفح لا يدعم الإشعارات";save();return}
 let p=Notification.permission;if(p==="default"){try{p=await Notification.requestPermission()}catch(e){}}
 if(p!=="granted"){$("ntf").checked=false;$("status").textContent="الإشعارات غير مسموحة، فعّلها من إعدادات المتصفح"}}
 save()};
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
async function start(){const m=getMin();if(!m){$("status").textContent="اكتب عدد الدقائق أولاً";return}
 try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume()}catch(e){}
 if($("wake").checked){try{wl=await navigator.wakeLock.request("screen")}catch(e){}}
 save();try{window.Android&&Android.start(m,$("order").value,JSON.stringify(D),$("spk").checked)}catch(e){}const ms=m*60000;next=Date.now()+ms;
 timer=setInterval(()=>{if(Date.now()>=next){next=Date.now()+ms;show()}},500);
 tick=setInterval(()=>{$("status").textContent="التذكير القادم بعد "+fmt(next-Date.now())},500);
 $("go").textContent="إيقاف التذكير";$("go").classList.add("stop")}
function stop(){try{window.Android&&Android.stop()}catch(e){}clearInterval(timer);clearInterval(tick);timer=null;try{wl&&wl.release()}catch(e){}wl=null;$("go").textContent="ابدأ التذكير";$("go").classList.remove("stop");$("status").textContent="تم الإيقاف"}
$("go").onclick=()=>timer?stop():start();
const CARD=new URLSearchParams(location.search).get("card");
if(window.Android){$("ntf").parentElement.style.display="none";$("perm").style.display="";$("perm").onclick=()=>{try{Android.permissions()}catch(e){}}}
if(CARD!==null&&D[+CARD]){const k=+CARD;document.body.classList.add("cardmode");$("ovpost").innerHTML=post(D[k][0],D[k][1]);$("ov").classList.add("on");fit($("ovpost"))}
$("close").onclick=()=>{$("ov").classList.remove("on");if(CARD!==null&&window.Android&&Android.close)Android.close()};
